<!DOCTYPE html>
<html>
<head>
    <style>
        .draggable {
            padding: 20px;
            margin: 10px;
            background: #f0f0f0;
            border: 2px solid #ccc;
            cursor: grab;
        }
        .draggable.dragging {
            opacity: 0.5;
        }
        .drag-over {
            border-color: blue;
        }
    </style>
</head>
<body>
    <h1>Drag & Drop Test</h1>
    <div class="draggable" draggable="true">Zeile 1</div>
    <div class="draggable" draggable="true">Zeile 2</div>
    <div class="draggable" draggable="true">Zeile 3</div>

    <script>
        let draggedElement = null;

        document.querySelectorAll('.draggable').forEach(item => {
            item.addEventListener('dragstart', (e) => {
                console.log('Drag start');
                draggedElement = e.currentTarget;
                e.currentTarget.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            });

            item.addEventListener('dragover', (e) => {
                e.preventDefault();
                console.log('Drag over');
                e.dataTransfer.dropEffect = 'move';
                if (e.currentTarget !== draggedElement) {
                    e.currentTarget.classList.add('drag-over');
                }
            });

            item.addEventListener('dragleave', (e) => {
                e.currentTarget.classList.remove('drag-over');
            });

            item.addEventListener('drop', (e) => {
                e.preventDefault();
                console.log('Drop');
                e.currentTarget.classList.remove('drag-over');
                
                if (draggedElement !== e.currentTarget) {
                    const parent = e.currentTarget.parentNode;
                    const draggedIndex = Array.from(parent.children).indexOf(draggedElement);
                    const dropIndex = Array.from(parent.children).indexOf(e.currentTarget);
                    
                    if (draggedIndex < dropIndex) {
                        parent.insertBefore(draggedElement, e.currentTarget.nextSibling);
                    } else {
                        parent.insertBefore(draggedElement, e.currentTarget);
                    }
                }
            });

            item.addEventListener('dragend', (e) => {
                console.log('Drag end');
                e.currentTarget.classList.remove('dragging');
                document.querySelectorAll('.drag-over').forEach(el => {
                    el.classList.remove('drag-over');
                });
            });
        });
    </script>
</body>
</html>
